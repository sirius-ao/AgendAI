# Shared runtime settings keep logs bounded for every service.
x-runtime: &runtime
  init: true
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'
  security_opt:
    - no-new-privileges:true

services:
  storage:
    <<: *runtime
    image: ${STORAGE_IMAGE:-elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd}
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-agendai-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-agendai-local-secret-change-me}
    ports:
      - '${S3_BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - agendai-files:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/ready']
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

  storage-init:
    <<: *runtime
    image: ${RCLONE_IMAGE:-rclone/rclone:1.68.2}
    depends_on:
      storage:
        condition: service_healthy
    # Use a list so sh -c receives the entire script as a single argument.
    # $$ defers expansion to the container rather than the host's .env.
    entrypoint: ['/bin/sh', '-ec']
    command:
      - exec rclone --config /dev/null mkdir "local:$${S3_BUCKET}"
    environment:
      RCLONE_CONFIG_LOCAL_TYPE: s3
      RCLONE_CONFIG_LOCAL_PROVIDER: Minio
      RCLONE_CONFIG_LOCAL_ENDPOINT: http://storage:9000
      RCLONE_CONFIG_LOCAL_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-agendai-local}
      RCLONE_CONFIG_LOCAL_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-agendai-local-secret-change-me}
      RCLONE_CONFIG_LOCAL_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-agendai-local}
    restart: 'no'

  database:
    <<: *runtime
    image: ${POSTGRES_IMAGE:-postgres:17.5-alpine}
    environment:
      POSTGRES_DB: agendai
      POSTGRES_USER: agendai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agendai-local}
    ports:
      - '${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - agendai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agendai -d agendai']
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

  api:
    <<: *runtime
    image: agendai-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      # Host port defaults to 3002 because 3001 is already used on the production server.
      - '${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3002}:3001'
    environment:
      NODE_ENV: production
      PORT: '3001'
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      REQUIRE_EMAIL_CONFIG: ${REQUIRE_EMAIL_CONFIG:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DATABASE_URL: postgresql://agendai:${POSTGRES_PASSWORD:-agendai-local}@database:5432/agendai?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Define JWT_ACCESS_SECRET com pelo menos 32 caracteres}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-agendai-local}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-agendai-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-agendai-local-secret-change-me}
    depends_on:
      database:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

  website:
    <<: *runtime
    image: agendai-website:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    ports:
      # Host port defaults to 3003 because 3000 is already used on the production server.
      - '${WEBSITE_BIND_ADDRESS:-127.0.0.1}:${WEBSITE_PORT:-3003}:3000'
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  agendai-postgres:
  agendai-files:
