services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agendai
      POSTGRES_USER: agendai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agendai-local}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - agendai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agendai -d agendai']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    init: true

  api:
    image: agendai-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '${API_PORT:-3001}:3001'
    environment:
      NODE_ENV: production
      PORT: '3001'
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://agendai:${POSTGRES_PASSWORD:-agendai-local}@database:5432/agendai?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Define JWT_ACCESS_SECRET com pelo menos 32 caracteres}
    depends_on:
      database:
        condition: service_healthy
    command: ['sh', '-c', 'pnpm db:deploy && pnpm start']
    restart: unless-stopped
    init: true

  website:
    image: agendai-website:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - '${WEBSITE_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

volumes:
  agendai-postgres:
